<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    {% if site.description %}
    <meta name="description" content="{{ site.description }}">
    {% endif %}
    {% include head-custom.html %}
  </head>
  <body>
    {% include water.html %}
    <header>
      <a class="title" href="{{ '/' | relative_url }}"><span class="site-name">{{ site.title }}</span></a>
      <nav>
        <div class="nav-links">
          <a class="nav-link" href="{{ '/' | relative_url }}" data-en="home" data-pt="início">home</a>
          {% if site.show_blog %}
          <a class="nav-link" href="{{ '/blog/' | relative_url }}" data-en="blog" data-pt="blog">blog</a>
          {% endif %}
          <a class="nav-link" href="{{ '/projects/' | relative_url }}" data-en="projects" data-pt="projetos">projects</a>
        </div>
        
        <div class="language-toggle">
          <a href="#" class="lang-link" data-lang="pt">pt</a>
          <span>|</span>
          <a href="#" class="lang-link active" data-lang="en">en</a>
        </div>
      </nav>
      
    </header>

    <main{% if page.inset %} class="inset"{% endif %}>
      {{ content }}
    </main>

    {% include footer.html %}
  </body>
  </html>
