<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }} · {{ site.title }}</title>
    {% include head-custom.html %}
  </head>
  <body>
    {% include water.html %}
    <header>
      <a class="title" href="{{ '/' | relative_url }}"><span class="site-name">{{ site.title }}</span></a>
      <nav>
        <div class="nav-links">
          <a class="nav-link" href="{{ '/' | relative_url }}" data-en="home" data-pt="início">home</a>
          {% if site.show_blog %}
          <a class="nav-link" href="{{ '/blog/' | relative_url }}" data-en="blog" data-pt="blog">blog</a>
          {% endif %}
          <a class="nav-link" href="{{ '/projects/' | relative_url }}" data-en="projects" data-pt="projetos">projects</a>
        </div>
        
        <div class="nav-tools">
          <button type="button" class="theme-toggle" aria-pressed="false" aria-label="Switch to light mode">
            <svg class="theme-icon theme-icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 15.5A8.5 8.5 0 0 1 9.2 4.2 7 7 0 1 0 20 15.5z"/></svg>
            <svg class="theme-icon theme-icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 3v1.8M12 19.2V21M4.9 4.9l1.3 1.3M17.8 17.8l1.3 1.3M3 12h1.8M19.2 12H21M4.9 19.1l1.3-1.3M17.8 6.2l1.3-1.3"/></svg>
          </button>
          <div class="language-toggle">
            <a href="#" class="lang-link" data-lang="pt">pt</a>
            <span>|</span>
            <a href="#" class="lang-link active" data-lang="en">en</a>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <article class="post">
        <h1>{{ page.title }}</h1>
        <p class="post-meta">
          <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time>
        </p>
        
        {{ content }}
      </article>
    </main>

    {% include footer.html %}
  </body>
</html>
